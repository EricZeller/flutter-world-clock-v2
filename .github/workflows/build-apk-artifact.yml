name: Build Android APK Artifact

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(grep '^  flutter:' pubspec.yaml | awk '{print $2}' | tr -d '^"')
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Java
        uses: actions/setup-java@v5 # Geändert auf v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Direkter Cache für Gradle (ersetzt gradle/actions/setup-gradle)
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      # printf writes the secrets as they are; the shell never expands them.
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=key.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Run tests
        run: flutter test

      # Maven Central sometimes answers Gradle with 429 Too Many Requests.
      - name: Build signed release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed, retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: worldclockv2-apks-${{ github.run_number }}
          path: | 
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
