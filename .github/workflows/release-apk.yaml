name: Build & Release Signed APK + App Bundle

on:
  release:
    types: [published]
  push:
    branches: [main]

# Uploading the release assets needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The signing and Play Store secrets live in this environment, which only
    # main and the v* tags may use.
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # A release must be tagged with the version it builds, e.g. v1.11.1.
      - name: Check release tag against pubspec.yaml version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match the pubspec.yaml version v$VERSION."
            exit 1
          fi

      - name: Get Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(grep 'flutter:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '^"')
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      # printf writes the secrets as they are; the shell never expands them.
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=key.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Get dependencies
        run: |
          flutter pub get
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
      
      - name: Run tests
        run: flutter test

      # Maven Central sometimes answers Gradle with 429 Too Many Requests.
      - name: Build signed release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed, retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Build signed release App Bundle
        run: |
          for attempt in 1 2 3; do
            flutter build appbundle --release && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed, retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Rename APK with version and source
        id: rename_apk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DATE=$(date +'%Y%m%d')
            APK_NAME="worldclockv2_v${VERSION}_${DATE}_${SHORT_SHA}_android_arm64.apk"
          else
            APK_NAME="worldclockv2_v${VERSION}_android_arm64.apk"
          fi
          
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${APK_NAME}
          
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Rename App Bundle with version and source
        id: rename_aab
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DATE=$(date +'%Y%m%d')
            AAB_NAME="worldclockv2_v${VERSION}_${DATE}_${SHORT_SHA}.aab"
          else
            AAB_NAME="worldclockv2_v${VERSION}.aab"
          fi
          
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/${AAB_NAME}
          
          echo "aab_name=${AAB_NAME}" >> $GITHUB_OUTPUT

      - name: Upload to Google Play
        if: github.event_name == 'release'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: de.ericz.worldclockv2
          releaseFiles: build/app/outputs/bundle/release/${{ steps.rename_aab.outputs.aab_name }}
          tracks: production
          status: completed
          # One file per language: whatsnew-<locale>, at most 500 characters.
          # Update them for every release.
          whatsNewDirectory: distribution/whatsnew

      - name: Upload build artifacts (Workflow Artifacts)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worldclockv2-android-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/worldclockv2*.apk
            build/app/outputs/bundle/release/worldclockv2*.aab
          retention-days: 7

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/app/outputs/flutter-apk/${{ steps.rename_apk.outputs.apk_name }}
            build/app/outputs/bundle/release/${{ steps.rename_aab.outputs.aab_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}