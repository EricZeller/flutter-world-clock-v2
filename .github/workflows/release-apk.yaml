name: Build & Release Signed APK + App Bundle

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(grep 'flutter:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '^"')
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Get dependencies
        run: |
          flutter pub get
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
      
      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed release App Bundle
        run: flutter build appbundle --release

      - name: Rename APK with version and source
        id: rename_apk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DATE=$(date +'%Y%m%d')
            APK_NAME="worldclockv2_v${VERSION}_${DATE}_${SHORT_SHA}_android_arm64.apk"
          else
            APK_NAME="worldclockv2_v${VERSION}_android_arm64.apk"
          fi
          
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${APK_NAME}
          
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Rename App Bundle with version and source
        id: rename_aab
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DATE=$(date +'%Y%m%d')
            AAB_NAME="worldclockv2_v${VERSION}_${DATE}_${SHORT_SHA}.aab"
          else
            AAB_NAME="worldclockv2_v${VERSION}.aab"
          fi
          
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/${AAB_NAME}
          
          echo "aab_name=${AAB_NAME}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts (Workflow Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: worldclockv2-android-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/worldclockv2*.apk
            build/app/outputs/bundle/release/worldclockv2*.aab
          retention-days: 7

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/${{ steps.rename_apk.outputs.apk_name }}
            build/app/outputs/bundle/release/${{ steps.rename_aab.outputs.aab_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}