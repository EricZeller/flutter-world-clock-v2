name: Build & Release Signed APK + App Bundle

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(grep 'flutter:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '^"')
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Get dependencies
        run: flutter pub get
      
      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed release App Bundle
        run: flutter build appbundle --release

      - name: Rename APK with version and source
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DATE=$(date +'%Y%m%d')
            APK_NAME="worldclockv2_v${VERSION}_${DATE}_${SHORT_SHA}.apk"
          else
            APK_NAME="worldclockv2_v${VERSION}.apk"
          fi
          
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${APK_NAME}
          
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Rename App Bundle with version and source
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DATE=$(date +'%Y%m%d')
            AAB_NAME="worldclockv2_v${VERSION}_${DATE}_${SHORT_SHA}.aab"
          else
            AAB_NAME="worldclockv2_v${VERSION}.aab"
          fi
          
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/${AAB_NAME}
          
          echo "aab_name=${AAB_NAME}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts (Workflow Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: worldclockv2-android-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/worldclockv2*.apk
            build/app/outputs/bundle/release/worldclockv2*.aab
          retention-days: 7

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/worldclockv2_v${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload App Bundle to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/bundle/release/worldclockv2_v${{ steps.version.outputs.version }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}