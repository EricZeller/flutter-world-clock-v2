name: Build & Release Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:

# Uploading the release assets needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # A release must be tagged with the version it builds, e.g. v1.11.1.
      - name: Check release tag against pubspec.yaml version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match the pubspec.yaml version v$VERSION."
            exit 1
          fi

      - name: Get Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(grep 'flutter:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '^"')
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT


      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build
        run: |
          if [ ${{ matrix.os }} = ubuntu-22.04 ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
            flutter build linux --release
            cd build/linux/x64/release/bundle
            tar -cJf ../../../../worldclockv2_v${{ steps.version.outputs.version }}_linux_x64.tar.xz ./*
          elif [ ${{ matrix.os }} = windows-latest ]; then
            choco install zip
            export CMAKE_GENERATOR="Visual Studio 17 2022"
            flutter build windows --release
            cd build/windows/x64/runner/Release
            zip -r ../../../../worldclockv2_v${{ steps.version.outputs.version }}_windows_x64.zip ./*
          elif [ ${{ matrix.os }} = macos-latest ]; then
            npm install -g appdmg
            flutter build macos --release
            APP="build/macos/Build/Products/Release/World Clock v2.app"
            # Ad-hoc signing from the inside out. --deep would drop the
            # entitlements, so every bundle keeps the ones Xcode signed it with
            # (e.g. the sandbox), minus the debugger entitlement. No hardened
            # runtime: it only matters for notarization, and its library
            # validation rejects ad-hoc signed frameworks at launch.
            sign() {
              ENTITLEMENTS="$RUNNER_TEMP/entitlements.plist"
              codesign -d --entitlements - --xml "$1" > "$ENTITLEMENTS" 2>/dev/null
              if [ -s "$ENTITLEMENTS" ]; then
                /usr/libexec/PlistBuddy -c "Delete :com.apple.security.get-task-allow" "$ENTITLEMENTS" 2>/dev/null || true
                codesign -s - --force --entitlements "$ENTITLEMENTS" "$1"
              else
                codesign -s - --force "$1"
              fi
            }
            for nested in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/PlugIns/*.appex; do
              [ -e "$nested" ] || continue
              sign "$nested"
            done
            sign "$APP"
            codesign --verify --deep --strict "$APP"
            appdmg installers/macos/config.json build/worldclockv2_v${{ steps.version.outputs.version }}_macos_x64.dmg
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worldclockv2-${{ matrix.os }}-build
          path: |
            build/worldclockv2*.zip
            build/worldclockv2*.tar.xz
            build/worldclockv2*.dmg
            
      # A manual run only builds artifacts to test; releases get the uploads.
      - name: Upload artifacts to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            build/worldclockv2_v${{ steps.version.outputs.version }}_linux_x64.tar.xz
            build/worldclockv2_v${{ steps.version.outputs.version }}_windows_x64.zip
            build/worldclockv2_v${{ steps.version.outputs.version }}_macos_x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
