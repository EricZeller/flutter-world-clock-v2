name: CI

# Checks every pull request without secrets: the APK is signed with the debug
# key. Signed builds of main come from release-apk.yaml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Flutter version from pubspec.yaml
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(grep '^  flutter:' pubspec.yaml | awk '{print $2}' | tr -d '^"')
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Maven Central sometimes answers Gradle with 429 Too Many Requests.
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed, retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      # The arm64 APK has to stay below 10 MiB.
      - name: Check APK size
        run: |
          SIZE=$(stat -c %s build/app/outputs/flutter-apk/app-release.apk)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -ge 10485760 ]; then
            echo "::error::The APK has $SIZE bytes, more than 10 MiB."
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worldclockv2-apks-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
