plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

android {
    namespace = 'de.ericz.worldclockv2'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = 'de.ericz.worldclockv2'
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        packagingOptions {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    signingConfigs {
        debug {
            // Standard debug configuration
        }
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

    androidResources {
        // Only package Android resource translations for the languages the
        // app itself supports (see res/xml/locale_config.xml and lib/l10n).
        // AndroidX libraries ship strings for ~90 locales that would otherwise
        // never be shown next to an English fallback UI.
        localeFilters += ['en', 'de', 'es', 'fr', 'pt']
    }

    android {
        dependenciesInfo {
            // Disables dependency metadata when building APKs.
            includeInApk = false
            // Disables dependency metadata when building Android App Bundles.
            includeInBundle = false
        }
    }
}

// AGP packages the native libraries of every ABI in Flutter's defaultConfig
// abiFilters (armeabi-v7a, arm64-v8a, x86_64), so prebuilt libraries of
// plugins (e.g. libdartjni.so) would end up in an arm64-only release APK for
// ABIs without Flutter libraries. Package only the ABIs Flutter builds for
// (`--target-platform`, all three by default), so the App Bundle keeps all
// three and `flutter run --release` on an x86_64 emulator still works.
// abiFilters can't do this: they are merged with Flutter's, and set on the
// release buildType they break `flutter build apk --split-per-abi`. Debug
// builds are left untouched.
def flutterPlatformAbis = [
    'android-arm'  : 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
    'android-x64'  : 'x86_64',
]
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def targetPlatforms = project.hasProperty('target-platform')
            ? project.property('target-platform').toString().split(',').toList()
            : flutterPlatformAbis.keySet()
        def flutterAbis = targetPlatforms.collect { flutterPlatformAbis[it] }
        def otherAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'] - flutterAbis
        variant.packaging.jniLibs.excludes.addAll(otherAbis.collect { "lib/$it/**".toString() })
    }
}

flutter {
    source = '../..'
}
